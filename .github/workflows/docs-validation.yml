name: Docs & Governance CI

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - '.lycheeignore'
      - '.gitattributes'
      - '.github/workflows/docs-validation.yml'
      - '.github/dependabot.yml'
      - 'meta-hub/scripts/**'
      - 'meta-hub/tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - '.lycheeignore'
      - '.gitattributes'
      - '.github/workflows/docs-validation.yml'
      - '.github/dependabot.yml'
      - 'meta-hub/scripts/**'
      - 'meta-hub/tests/**'
  workflow_dispatch:
  schedule:
    # Executa toda segunda-feira às 08:00 UTC (auditoria recorrente de links e governança)
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  links-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-file .lycheeignore './**/*.md'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  powershell-tests:
    name: PowerShell Scripts & Pester Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate PowerShell Scripts AST Syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path "meta-hub/scripts" -Filter "*.ps1" -ErrorAction SilentlyContinue
          if (-not $scripts) {
            Write-Host "Nenhum script encontrado em meta-hub/scripts."
            exit 0
          }
          $hasError = $false
          foreach ($script in $scripts) {
            Write-Host "Analisando $($script.Name)..."
            $errors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Erro de sintaxe em $($script.Name):"
              $errors | ForEach-Object { Write-Error $_ }
              $hasError = $true
            } else {
              Write-Host "✅ $($script.Name) sintaxe válida!" -ForegroundColor Green
            }
          }
          if ($hasError) { exit 1 }

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Invoke-Pester -Path "meta-hub/tests"
